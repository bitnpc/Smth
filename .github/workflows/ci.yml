name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2
          bundler-cache: true

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Verify Xcode version
        run: xcodebuild -version

      - name: Install dependencies
        run: bundle install

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Boot iOS Simulator
        run: |
          # 获取第一个可用的 iPhone 模拟器并启动
          SIMULATOR_UDID=$(xcrun simctl list devices available --json | grep -A 5 '"iPhone' | grep '"udid"' | head -1 | cut -d'"' -f4)
          if [ -n "$SIMULATOR_UDID" ]; then
            echo "Booting simulator: $SIMULATOR_UDID"
            xcrun simctl boot "$SIMULATOR_UDID" || true
            # 等待模拟器完全启动
            sleep 10
          fi

      - name: Run Fastlane CI lane
        env:
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 60
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: 3
        run: bundle exec fastlane ci


