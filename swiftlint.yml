disabled_rules:
  - identifier_name
  - trailing_whitespace

included:
  - App
  - SmthTests

opt_in_rules:
  - empty_count
  - redundant_nil_coalescing

line_length:
  warning: 140
  error: 180

type_name:
  max_length:
    warning: 40
    error: 50

force_cast:
  severity: warning

function_body_length:
  warning: 175
  error: 200

function_parameter_count:
  warning: 7
  error: 10

type_body_length:
  warning: 410
  error: 500

file_length:
  warning: 600
  error: 700

cyclomatic_complexity:
  warning: 20
  error: 25

